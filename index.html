<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="診間 — 臨床日常小工具集合，計算、量表與快速參考集中一處。"
    />
    <title>診間 · 臨床小工具</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <div class="atmosphere__wash"></div>
      <div class="atmosphere__grid"></div>
      <div class="atmosphere__orb atmosphere__orb--a"></div>
      <div class="atmosphere__orb atmosphere__orb--b"></div>
    </div>

    <header class="topbar">
      <a class="topbar__brand" href="#top">診間</a>
      <nav class="topbar__nav" aria-label="主要導覽">
        <a href="#tools">工具</a>
      </nav>
    </header>

    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero__copy">
          <p class="hero__brand">診間</p>
          <h1 id="hero-title">臨床日常所需，集中一處。</h1>
          <p class="hero__lead">
            計算、量表與快速參考。之後會逐項加入你真正會用的工具。
          </p>
          <div class="hero__actions">
            <a class="btn btn--primary" href="#tools">瀏覽工具</a>
          </div>
        </div>
        <aside class="hero__visual" aria-hidden="true">
          <div class="pulse-panel">
            <svg
              class="pulse-panel__wave"
              viewBox="0 0 320 120"
              preserveAspectRatio="none"
            >
              <path
                class="pulse-panel__path"
                d="M0 60 H48 L58 60 L68 28 L78 92 L88 60 H140 L150 60 L160 40 L170 80 L180 60 H320"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <div class="pulse-panel__meta">
              <span>ready</span>
              <span class="pulse-panel__dot"></span>
              <span>0 tools</span>
            </div>
          </div>
        </aside>
      </section>

      <section class="tools" id="tools" aria-labelledby="tools-title">
        <div class="tools__head">
          <h2 id="tools-title">工具</h2>
          <p>個人臨床小工具。之後還會陸續加入。</p>
        </div>

        <ul class="tool-list" id="tool-list" hidden></ul>

        <div class="empty" id="empty-state">
          <p class="empty__label">等待第一個工具</p>
          <p class="empty__hint">告訴我名稱、用途與輸入輸出，即可開始。</p>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>診間 · 個人臨床小工具</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
